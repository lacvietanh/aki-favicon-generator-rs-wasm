[package]
name = "aki-favicon-generator"
version = "0.1.0"
edition = "2021"
description = "Client-side WASM favicon generator — PWA compliant, zero-server"

[lib]
crate-type = ["cdylib"]

# ── Release: optimized for WASM bundle size
[profile.release]
opt-level = "z"       # Optimize for size (not speed)
lto = true            # Link-Time Optimization — eliminates dead code across crates
codegen-units = 1     # Allows LLVM to optimize the entire codebase as one unit
panic = "abort"       # No stack unwinding in WASM → smaller binary
strip = true          # Strip debug symbols

[package.metadata.wasm-pack.profile.release]
wasm-opt = false


[dependencies]
# WASM bridge
wasm-bindgen = "0.2"
js-sys = "0.3"

# Image processing — only PNG + JPEG features enabled, everything else disabled
# Goal: minimize bundle size
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Console logging in the browser (debug only)
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
